<!DOCTYPE html>

<!-- index.html - 홈(메인) 페이지
    - 서비스 소개 화면 - DB 조회 없이 정적으로 렌더링
-->
<head th:replace="~{fragments/head :: head(pageTitle='홈')}"><title> </title></head>
<body>

    <div class="main-layout" style="display: flex; min-height: 100vh;">

        <!-- 1. 왼쪽 사이드바 -->
        <div th:replace="~{fragments/sidebar :: sidebar(currentPage='home')}"></div>

        <!-- 2. 오른쪽 영역 (헤더 + 본문) -->
        <div class="main-wrapper" style="flex: 1; display: flex; flex-direction: column; margin: 0">

            <!-- 상단 헤더 -->
            <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'home'} })}"></div>

            <!-- 메인 콘텐츠 -->
            <main class="content" style="flex: 1;">
                <div class="card-grid">
                    <div th:each="num : ${#numbers.sequence(1, 6)}">
                        <div th:replace="~{dashboard/dashboard-card :: dashboardCard}">
                            북 카드 자리 (서버 실행시 fragment로 교체됨)
                        </div>
                    </div>
                </div>
            </main>

            <!-- 하단 푸터 삽입 -->
            <footer th:replace="~{fragments/footer :: footer}"></footer>
            <!-- 자바 스크립트 -->
            <script th:src="@{/js/dashboard/main.js}"></script>
        </div>
    </div>
</body>
